[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#EEF2F7"
textColor = "#1F2937"
linkColor = "#0F766E"
font = "sans serif"
baseRadius = "8px"
buttonRadius = "8px"
borderColor = "#E3E8EF"
showWidgetBorder = true
dataframeBorderColor = "#E3E8EF"
dataframeHeaderBackgroundColor = "#EEF2F7"
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F9FC"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
